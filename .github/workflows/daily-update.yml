name: Daily Update

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get website files
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install free translator
        run: pip install deep-translator

      - name: Update news
        run: python update_site.py

      - name: Save updates
        run: |
          git config user.name "Hassan Daily Bot"
          git config user.email "actions@github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Daily automatic news update"
          git push
