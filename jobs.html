<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hassan Daily Jobs</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .topbar {
      background: #0f172a;
      color: white;
      padding: 14px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 20px;
      font-weight: bold;
    }

    .nav {
      display: flex;
      gap: 10px;
    }

    .nav a {
      color: white;
      text-decoration: none;
      padding: 9px 15px;
      border-radius: 9px;
      background: rgba(255,255,255,.08);
    }

    .nav a.active {
      background: white;
      color: #111827;
      font-weight: bold;
    }

    .hero {
      background: #111827;
      color: white;
      padding: 35px 22px;
    }

    .hero-inner {
      max-width: 1100px;
      margin: auto;
    }

    .hero h1 {
      margin: 0 0 8px;
    }

    .hero p {
      margin: 0;
      color: #cbd5e1;
    }

    .controls {
      max-width: 1100px;
      margin: 22px auto 15px;
      padding: 0 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .controls button {
      border: 1px solid #d1d5db;
      background: white;
      padding: 10px 15px;
      border-radius: 20px;
      cursor: pointer;
    }

    .controls button.active {
      background: #111827;
      color: white;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 0 15px 45px;
    }

    .job-card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    .job-card.opened {
      opacity: .55;
      background: #eceff3;
    }

    .job-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .job-card h2 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .company {
      font-weight: bold;
      color: #374151;
    }

    .tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 15px 0;
    }

    .tag {
      background: #e5e7eb;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 13px;
    }

    .status {
      background: #dcfce7;
      color: #166534;
      padding: 6px 10px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13px;
    }

    .job-card p {
      color: #4b5563;
      line-height: 1.8;
    }

    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
      color: #6b7280;
      font-size: 13px;
    }

    .apply-link {
      background: #111827;
      color: white;
      text-decoration: none;
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="topbar">
  <div class="brand">Hassan Daily</div>

  <div class="nav">
    <a href="index.html">الأخبار</a>
    <a href="jobs.html" class="active">الوظائف</a>
  </div>
</div>

<section class="hero">
  <div class="hero-inner">
    <h1>الوظائف</h1>
    <p>الفرص المناسبة والمحدثة وروابط التقديم الرسمية</p>
  </div>
</section>

<div class="controls">
  <button class="active" onclick="filterJobs('all', this)">الكل</button>
  <button onclick="filterJobs('Jazan', this)">جازان</button>
  <button onclick="filterJobs('Asir', this)">عسير</button>
  <button onclick="filterJobs('Riyadh', this)">الرياض</button>
  <button onclick="filterJobs('Jeddah', this)">جدة</button>
</div>

<main id="jobs-container">
  جاري تحميل الوظائف...
</main>

<script>
let allJobs = [];
let currentCity = "all";

fetch("jobs.json")
  .then(response => response.json())
  .then(data => {
    allJobs = data;
    renderJobs();
  })
  .catch(error => {
    document.getElementById("jobs-container").innerHTML =
      "<p>تعذر تحميل الوظائف.</p>";
  });

function renderJobs() {
  const container = document.getElementById("jobs-container");

  const filtered = allJobs.filter(job =>
    currentCity === "all" || job.city === currentCity
  );

  if (filtered.length === 0) {
    container.innerHTML = "<p>لا توجد وظائف في هذا التصنيف.</p>";
    return;
  }

  container.innerHTML = filtered.map(job => {
    const opened =
      localStorage.getItem(job.id) === "opened";

    return `
      <article class="job-card ${opened ? "opened" : ""}">
        <div class="job-top">
          <div>
            <h2>${job.title}</h2>
            <div class="company">${job.company}</div>
          </div>

          <span class="status">${job.status}</span>
        </div>

        <div class="tags">
          <span class="tag">📍 ${job.city_ar}</span>
          <span class="tag">${job.category}</span>
          <span class="tag">${job.type}</span>
        </div>

        <p>${job.summary}</p>

        <div class="bottom">
          <span>نُشرت: ${job.date}</span>

          <a
            class="apply-link"
            href="${job.url}"
            target="_blank"
            onclick="markOpened('${job.id}')">
            التقديم
          </a>
        </div>
      </article>
    `;
  }).join("");
}

function markOpened(id) {
  localStorage.setItem(id, "opened");
}

function filterJobs(city, button) {
  currentCity = city;

  document.querySelectorAll(".controls button")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");
  renderJobs();
}
</script>

</body>
</html>
