<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hassan Daily</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .topbar {
      background: #0f172a;
      color: white;
      padding: 14px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      font-size: 20px;
      font-weight: bold;
    }

    .nav {
      display: flex;
      gap: 10px;
    }

    .nav a {
      color: white;
      text-decoration: none;
      padding: 9px 15px;
      border-radius: 9px;
      background: rgba(255,255,255,.08);
    }

    .nav a.active {
      background: white;
      color: #111827;
      font-weight: bold;
    }

    .hero {
      background: #111827;
      color: white;
      padding: 35px 22px;
    }

    .hero-inner {
      max-width: 1100px;
      margin: auto;
    }

    .hero h1 {
      margin: 0 0 8px;
    }

    .hero p {
      margin: 0;
      color: #cbd5e1;
    }

    .controls {
      max-width: 1100px;
      margin: 22px auto 15px;
      padding: 0 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .controls button {
      border: 1px solid #d1d5db;
      background: white;
      padding: 10px 15px;
      border-radius: 20px;
      cursor: pointer;
    }

    .controls button.active {
      background: #111827;
      color: white;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 0 15px 45px;
    }

    .news-card {
      background: white;
      display: grid;
      grid-template-columns: 290px 1fr;
      margin-bottom: 18px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    .news-card.read {
      opacity: .5;
      background: #eceff3;
    }

    .news-image {
      min-height: 210px;
      background-size: cover;
      background-position: center;
      background-color: #d1d5db;
    }

    .news-content {
      padding: 22px;
    }

    .meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .badge {
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 13px;
    }

    .category {
      background: #111827;
      color: white;
    }

    .source {
      background: #e5e7eb;
    }

    .breaking {
      background: #fee2e2;
      color: #991b1b;
      font-weight: bold;
    }

    h2 {
      margin: 0 0 12px;
    }

    p {
      line-height: 1.8;
    }

    .bottom {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
      color: #6b7280;
      font-size: 13px;
      margin-top: 18px;
    }

    .read-link {
      background: #111827;
      color: white;
      text-decoration: none;
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: bold;
    }

    @media (max-width: 750px) {
      .news-card {
        grid-template-columns: 1fr;
      }

      .news-image {
        height: 210px;
      }
    }
  </style>
</head>

<body>

<div class="topbar">
  <div class="brand">Hassan Daily</div>

  <div class="nav">
    <a href="index.html" class="active">الأخبار</a>
    <a href="jobs.html">الوظائف</a>
  </div>
</div>

<section class="hero">
  <div class="hero-inner">
    <h1>الأخبار اليومية</h1>
    <p>أهم الأخبار المختارة والمحدثة في مكان واحد</p>
  </div>
</section>

<div class="controls">
  <button class="active" onclick="filterNews('all', this)">الكل</button>
  <button onclick="filterNews('Saudi', this)">السعودية</button>
  <button onclick="filterNews('World', this)">العالم</button>
  <button onclick="filterNews('Gaming', this)">ألعاب</button>
  <button onclick="filterNews('Sports', this)">رياضة</button>
  <button onclick="filterNews('Tech', this)">تقنية</button>
  <button onclick="toggleUnread(this)">غير المقروء فقط</button>
</div>

<main id="news-container">
  جاري تحميل الأخبار...
</main>

<script>
let allNews = [];
let currentCategory = "all";
let unreadOnly = false;

fetch("news.json")
  .then(response => response.json())
  .then(data => {
    allNews = data;
    renderNews();
  })
  .catch(error => {
    document.getElementById("news-container").innerHTML =
      "<p>تعذر تحميل الأخبار.</p>";
  });

function renderNews() {
  const container = document.getElementById("news-container");

  const filtered = allNews.filter(news => {
    const categoryMatch =
      currentCategory === "all" ||
      news.category === currentCategory;

    const isRead =
      localStorage.getItem(news.id) === "read";

    const unreadMatch =
      !unreadOnly || !isRead;

    return categoryMatch && unreadMatch;
  });

  if (filtered.length === 0) {
    container.innerHTML = "<p>لا توجد أخبار في هذا التصنيف.</p>";
    return;
  }

  container.innerHTML = filtered.map(news => {
    const isRead =
      localStorage.getItem(news.id) === "read";

    return `
      <article class="news-card ${isRead ? "read" : ""}">
        <div
          class="news-image"
          style="background-image:url('${news.image}')">
        </div>

        <div class="news-content">
          <div class="meta">
            <span class="badge category">
              ${news.category_ar}
            </span>

            <span class="badge source">
              ${news.source}
            </span>

            ${
              news.breaking
              ? '<span class="badge breaking">عاجل</span>'
              : ''
            }
          </div>

          <h2>${news.title}</h2>

          <p>${news.summary}</p>

          <div class="bottom">
            <span>${news.date}</span>

            <a
              class="read-link"
              href="${news.url}"
              target="_blank"
              onclick="markRead('${news.id}')">
              فتح المصدر
            </a>
          </div>
        </div>
      </article>
    `;
  }).join("");
}

function markRead(id) {
  localStorage.setItem(id, "read");
}

function filterNews(category, button) {
  currentCategory = category;

  document.querySelectorAll(".controls button")
    .forEach(btn => {
      if (btn.textContent !== "غير المقروء فقط") {
        btn.classList.remove("active");
      }
    });

  button.classList.add("active");
  renderNews();
}

function toggleUnread(button) {
  unreadOnly = !unreadOnly;
  button.classList.toggle("active");
  renderNews();
}
</script>

</body>
</html>
